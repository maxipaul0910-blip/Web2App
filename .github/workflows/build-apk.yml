          cat > $P/template/src/main/java/com/web2apk/template/MainActivity.java <<'EOF'
          package com.web2apk.template;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String scheme = request.getUrl().getScheme();
                          if (scheme == null || scheme.equals("http") || scheme.equals("https") || scheme.equals("file")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl()));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(resolveStartUrl());
                  }
              }

              // assets/config.txt is written by the builder app: "URL=https://..." or "FILE=page.html"
              private String resolveStartUrl() {
                  String cfg = "";
                  try (InputStream in = getAssets().open("config.txt");
                       BufferedReader r = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8))) {
                      String line = r.readLine();
                      if (line != null) cfg = line.trim();
                  } catch (Exception ignored) {
                  }
                  if (cfg.startsWith("URL=")) {
                      String u = cfg.substring(4).trim();
                      if (!u.startsWith("http://") && !u.startsWith("https://")) u = "https://" + u;
                      return u;
                  }
                  if (cfg.startsWith("FILE=")) {
                      return "file:///android_asset/www/" + Uri.encode(cfg.substring(5).trim());
                  }
                  return "file:///android_asset/www/index.html";
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  webView.destroy();
                  super.onDestroy();
              }
          }
