          package com.web2apk.builder;

          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;

          import com.android.apksig.ApkSigner;

          import java.io.File;
          import java.math.BigInteger;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.security.cert.X509Certificate;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;

          import javax.security.auth.x500.X500Principal;

          /**
           * Signs APKs with a key that lives in the Android Keystore of this phone.
           * The same key is reused for every app, so rebuilding an app updates the installed one.
           */
          final class Signer {

              private static final String ALIAS = "web2apk_signing_key";

              private Signer() {
              }

              static void sign(File unsignedApk, File signedApk) throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);

                  if (!ks.containsAlias(ALIAS)) {
                      KeyPairGenerator kpg = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_RSA, "AndroidKeyStore");
                      kpg.initialize(new KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_SIGN)
                              .setKeySize(2048)
                              .setDigests(KeyProperties.DIGEST_SHA256)
                              .setSignaturePaddings(KeyProperties.SIGNATURE_PADDING_RSA_PKCS1)
                              .setCertificateSubject(new X500Principal("CN=Web2APK"))
                              .setCertificateSerialNumber(BigInteger.ONE)
                              .setCertificateNotBefore(new Date(System.currentTimeMillis() - 86400000L))
                              .setCertificateNotAfter(new Date(2208988800000L)) // 2040-01-01
                              .build());
                      kpg.generateKeyPair();
                  }

                  PrivateKey key = (PrivateKey) ks.getKey(ALIAS, null);
                  Certificate[] chain = ks.getCertificateChain(ALIAS);
                  List<X509Certificate> certs = new ArrayList<>();
                  for (Certificate c : chain) certs.add((X509Certificate) c);

                  ApkSigner.SignerConfig cfg = new ApkSigner.SignerConfig.Builder("web2apk", key, certs).build();
                  ApkSigner signer = new ApkSigner.Builder(Collections.singletonList(cfg))
                          .setInputApk(unsignedApk)
                          .setOutputApk(signedApk)
                          .setMinSdkVersion(24)
                          .setV1SigningEnabled(false)
                          .setV2SigningEnabled(true)
                          .setV3SigningEnabled(false)
                          .build();
                  signer.sign();
              }
          }
