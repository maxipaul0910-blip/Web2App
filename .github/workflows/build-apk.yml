name: Build Web2APK app

# Builds an Android app that turns website links or local HTML files into installable APKs
# directly on your phone. Runs automatically when this file is committed; open the finished
# run and download the "Web2APK-app" artifact.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Generate project
        run: |
          set -e
          P=_proj
          mkdir -p $P/builder $P/builder/src/main $P/builder/src/main/java/com/web2apk/builder $P/builder/src/main/res/drawable $P/builder/src/main/res/xml $P/template $P/template/src/main $P/template/src/main/java/com/web2apk/template $P/template/src/main/res/drawable-nodpi

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "web2apk"
          include(":template", ":builder")
          EOF

          cat > $P/builder/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.web2apk.builder"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.web2apk.builder"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              androidResources {
                  noCompress += "apk"
              }

              sourceSets {
                  getByName("main") {
                      assets.srcDir(layout.buildDirectory.dir("generated/template"))
                  }
              }

              lint {
                  abortOnError = false
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.core:core:1.13.1")
              implementation("com.android.tools.build:apksig:8.7.3")
          }

          // Build the blank template app first and embed its APK as assets/template.apk
          val copyTemplateApk = tasks.register<Copy>("copyTemplateApk") {
              dependsOn(":template:assembleRelease")
              from(project(":template").layout.buildDirectory.dir("outputs/apk/release")) {
                  include("*.apk")
                  rename { "template.apk" }
              }
              into(layout.buildDirectory.dir("generated/template"))
          }

          tasks.configureEach {
              if (name.startsWith("merge") && name.endsWith("Assets")) {
                  dependsOn(copyTemplateApk)
              }
          }
          EOF

          cat > $P/builder/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Web2APK"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name="com.web2apk.builder.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.web2apk.builder.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > $P/builder/src/main/java/com/web2apk/builder/ApkPatcher.java <<'EOF'
          package com.web2apk.builder;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FilterOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.Enumeration;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Pattern;
          import java.util.zip.CRC32;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;
          import java.util.zip.ZipOutputStream;

          /**
           * Turns the blank template APK into a new, unsigned APK.
           *
           * The template's package name and label are placeholder strings. The binary manifest's
           * string table is rebuilt with the real values (any length, any characters), the icon PNG,
           * assets/config.txt and assets/www/* are swapped, old signatures are dropped and everything
           * is re-zipped uncompressed and 4-byte aligned (required for resources.arsc).
           */
          public final class ApkPatcher {

              /** Must match applicationId in template/build.gradle.kts. */
              public static final String PKG_PLACEHOLDER = "com.w2a.xpppppppppppppppp";
              /** Must match android:label in the template manifest. */
              public static final String LABEL_PLACEHOLDER = "WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW";
              /** The builder's own id: a generated app must never use it (it would replace the builder). */
              public static final String BUILDER_PACKAGE = "com.web2apk.builder";

              public static final int MAX_LABEL = 60;
              public static final int MAX_PACKAGE = 120;

              private static final Pattern PKG_PATTERN =
                      Pattern.compile("^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$");
              private static final long FIXED_TIME = 1262304000000L; // 2010-01-01

              private ApkPatcher() {
              }

              /** At least two dot-separated segments, each starting with a letter (letters, digits, _). */
              public static boolean isValidPackage(String s) {
                  return s != null && s.length() <= MAX_PACKAGE && PKG_PATTERN.matcher(s).matches();
              }

              /** Trims, drops control characters, caps the length, never returns an empty label. */
              public static String cleanLabel(String name) {
                  String s = name == null ? "" : name.replaceAll("\\p{Cntrl}", " ").trim();
                  if (s.length() > MAX_LABEL) {
                      s = s.substring(0, MAX_LABEL);
                      if (Character.isHighSurrogate(s.charAt(s.length() - 1))) {
                          s = s.substring(0, s.length() - 1);
                      }
                      s = s.trim();
                  }
                  return s.isEmpty() ? "App" : s;
              }

              public static void build(File templateApk, OutputStream out, String packageName, String label,
                                       byte[] iconPng, String config, Map<String, byte[]> wwwFiles) throws IOException {
                  if (!isValidPackage(packageName)) {
                      throw new IOException("Invalid package name: " + packageName);
                  }
                  if (packageName.equals(BUILDER_PACKAGE)) {
                      throw new IOException("That package name belongs to Web2APK itself");
                  }

                  Map<String, byte[]> entries = readZip(templateApk);

                  // Remove old signatures and any content from a previous build
                  Iterator<String> it = entries.keySet().iterator();
                  while (it.hasNext()) {
                      String n = it.next();
                      if (n.regionMatches(true, 0, "META-INF/", 0, 9)
                              || n.equals("assets/config.txt")
                              || n.startsWith("assets/www/")) {
                          it.remove();
                      }
                  }

                  byte[] manifest = entries.get("AndroidManifest.xml");
                  if (manifest == null) throw new IOException("Template has no AndroidManifest.xml");
                  Map<String, String> repl = new LinkedHashMap<>();
                  repl.put(PKG_PLACEHOLDER, packageName);
                  repl.put(LABEL_PLACEHOLDER, cleanLabel(label));
                  Set<String> found = new HashSet<>();
                  entries.put("AndroidManifest.xml", rewriteXmlStrings(manifest, repl, found));
                  if (!found.contains(PKG_PLACEHOLDER)) throw new IOException("Package placeholder not found in template");
                  if (!found.contains(LABEL_PLACEHOLDER)) throw new IOException("Label placeholder not found in template");

                  byte[] arsc = entries.get("resources.arsc");
                  if (arsc != null) patchArscPackageName(arsc, PKG_PLACEHOLDER, packageName);

                  if (iconPng != null) {
                      for (Map.Entry<String, byte[]> e : entries.entrySet()) {
                          String k = e.getKey();
                          if (k.startsWith("res/") && k.toLowerCase(Locale.ROOT).endsWith(".png")) {
                              e.setValue(iconPng);
                          }
                      }
                  }

                  entries.put("assets/config.txt", config.getBytes(StandardCharsets.UTF_8));
                  for (Map.Entry<String, byte[]> f : wwwFiles.entrySet()) {
                      entries.put("assets/www/" + f.getKey(), f.getValue());
                  }

                  writeAligned(entries, out);
              }

              // ---------------------------------------------------------------- binary XML string pool

              private static int u16(byte[] d, int pos) {
                  return (d[pos] & 0xFF) | ((d[pos + 1] & 0xFF) << 8);
              }

              /**
               * Rebuilds the string pool of a compiled (binary) XML file with the given substring
               * replacements. Every string keeps its index, so the rest of the file stays valid.
               * Keys that matched at least once are added to {@code found}.
               */
              public static byte[] rewriteXmlStrings(byte[] xml, Map<String, String> repl, Set<String> found)
                      throws IOException {
                  ByteBuffer b = ByteBuffer.wrap(xml).order(ByteOrder.LITTLE_ENDIAN);
                  if (xml.length < 36 || u16(xml, 0) != 0x0003) throw new IOException("Manifest is not binary XML");
                  int poolOff = u16(xml, 2);
                  if (u16(xml, poolOff) != 0x0001) throw new IOException("String pool not found");
                  int poolHdr = u16(xml, poolOff + 2);
                  int poolSize = b.getInt(poolOff + 4);
                  int count = b.getInt(poolOff + 8);
                  int styleCount = b.getInt(poolOff + 12);
                  int flags = b.getInt(poolOff + 16);
                  int strStart = b.getInt(poolOff + 20);
                  int styStart = b.getInt(poolOff + 24);
                  boolean utf8 = (flags & 0x100) != 0;
                  if (poolHdr < 28 || poolSize < poolHdr || poolOff + poolSize > xml.length
                          || count < 0 || styleCount < 0
                          || (long) poolHdr + 4L * count + 4L * styleCount > poolSize) {
                      throw new IOException("Corrupt string pool");
                  }
                  int poolEnd = poolOff + poolSize;

                  ByteArrayOutputStream strings = new ByteArrayOutputStream();
                  int[] offsets = new int[count];
                  for (int i = 0; i < count; i++) {
                      int abs = poolOff + strStart + b.getInt(poolOff + poolHdr + 4 * i);
                      if (abs < poolOff || abs + 2 > poolEnd) throw new IOException("Corrupt string offset");

                      int rawLen;
                      String s;
                      if (utf8) {
                          int p = 1;
                          int n16 = xml[abs] & 0xFF;
                          if ((n16 & 0x80) != 0) {
                              n16 = ((n16 & 0x7F) << 8) | (xml[abs + 1] & 0xFF);
                              p = 2;
                          }
                          int p2 = 1;
                          int nb = xml[abs + p] & 0xFF;
                          if ((nb & 0x80) != 0) {
                              nb = ((nb & 0x7F) << 8) | (xml[abs + p + 1] & 0xFF);
                              p2 = 2;
                          }
                          rawLen = p + p2 + nb + 1;
                          if (abs + rawLen > poolEnd) throw new IOException("Corrupt string entry");
                          s = new String(xml, abs + p + p2, nb, StandardCharsets.UTF_8);
                      } else {
                          int n = u16(xml, abs);
                          int pre = 2;
                          if ((n & 0x8000) != 0) {
                              n = ((n & 0x7FFF) << 16) | u16(xml, abs + 2);
                              pre = 4;
                          }
                          rawLen = pre + n * 2 + 2;
                          if (abs + rawLen > poolEnd) throw new IOException("Corrupt string entry");
                          s = new String(xml, abs + pre, n * 2, StandardCharsets.UTF_16LE);
                      }

                      String ns = s;
                      for (Map.Entry<String, String> e : repl.entrySet()) {
                          if (ns.contains(e.getKey())) {
                              ns = ns.replace(e.getKey(), e.getValue());
                              found.add(e.getKey());
                          }
                      }

                      offsets[i] = strings.size();
                      if (ns.equals(s)) {
                          strings.write(xml, abs, rawLen); // untouched strings keep their exact bytes
                      } else {
                          byte[] enc = encodeString(ns, utf8);
                          strings.write(enc, 0, enc.length);
                      }
                  }
                  while (strings.size() % 4 != 0) strings.write(0);
                  byte[] stringData = strings.toByteArray();

                  boolean hasStyles = styleCount > 0 && styStart > 0;
                  byte[] styleData = hasStyles ? Arrays.copyOfRange(xml, poolOff + styStart, poolEnd) : new byte[0];

                  int newStrStart = poolHdr + 4 * count + 4 * styleCount;
                  int newStyStart = hasStyles ? newStrStart + stringData.length : 0;
                  int newPoolSize = newStrStart + stringData.length + styleData.length;

                  ByteBuffer p = ByteBuffer.allocate(newPoolSize).order(ByteOrder.LITTLE_ENDIAN);
                  p.put(xml, poolOff, poolHdr);
                  p.putInt(4, newPoolSize);
                  p.putInt(20, newStrStart);
                  p.putInt(24, newStyStart);
                  p.position(poolHdr);
                  for (int i = 0; i < count; i++) p.putInt(offsets[i]);
                  if (styleCount > 0) p.put(xml, poolOff + poolHdr + 4 * count, 4 * styleCount);
                  p.put(stringData);
                  p.put(styleData);

                  int declared = b.getInt(4);
                  byte[] out = new byte[xml.length - poolSize + newPoolSize];
                  System.arraycopy(xml, 0, out, 0, poolOff);
                  System.arraycopy(p.array(), 0, out, poolOff, newPoolSize);
                  System.arraycopy(xml, poolEnd, out, poolOff + newPoolSize, xml.length - poolEnd);
                  ByteBuffer.wrap(out).order(ByteOrder.LITTLE_ENDIAN).putInt(4, declared - poolSize + newPoolSize);
                  return out;
              }

              private static byte[] encodeString(String s, boolean utf8) throws IOException {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  if (utf8) {
                      byte[] bytes = s.getBytes(StandardCharsets.UTF_8);
                      if (s.length() > 0x7FFF || bytes.length > 0x7FFF) throw new IOException("String too long");
                      writeLen8(o, s.length());
                      writeLen8(o, bytes.length);
                      o.write(bytes, 0, bytes.length);
                      o.write(0);
                  } else {
                      int n = s.length();
                      if (n > 0x7FFF) throw new IOException("String too long");
                      o.write(n & 0xFF);
                      o.write((n >>> 8) & 0xFF);
                      byte[] chars = s.getBytes(StandardCharsets.UTF_16LE);
                      o.write(chars, 0, chars.length);
                      o.write(0);
                      o.write(0);
                  }
                  return o.toByteArray();
              }

              private static void writeLen8(ByteArrayOutputStream o, int n) {
                  if (n > 0x7F) {
                      o.write(0x80 | (n >>> 8));
                      o.write(n & 0xFF);
                  } else {
                      o.write(n);
                  }
              }

              // ---------------------------------------------------------------- resources.arsc

              /** Overwrites the (fixed-size, 128 char) package name field of each resource package. */
              public static void patchArscPackageName(byte[] arsc, String oldName, String newName) {
                  if (newName.length() > 127 || arsc.length < 12 || u16(arsc, 0) != 0x0002) return;
                  ByteBuffer b = ByteBuffer.wrap(arsc).order(ByteOrder.LITTLE_ENDIAN);
                  int off = u16(arsc, 2);
                  int total = Math.min(b.getInt(4), arsc.length);
                  while (off + 8 <= total) {
                      int type = u16(arsc, off);
                      int size = b.getInt(off + 4);
                      if (size < 8 || off + size > total) break;
                      if (type == 0x0200 && size >= 12 + 256) {
                          int nameOff = off + 12;
                          int len = 0;
                          while (len < 128 && u16(arsc, nameOff + 2 * len) != 0) len++;
                          String cur = new String(arsc, nameOff, len * 2, StandardCharsets.UTF_16LE);
                          if (cur.equals(oldName)) {
                              byte[] nn = newName.getBytes(StandardCharsets.UTF_16LE);
                              Arrays.fill(arsc, nameOff, nameOff + 256, (byte) 0);
                              System.arraycopy(nn, 0, arsc, nameOff, nn.length);
                          }
                      }
                      off += size;
                  }
              }

              // ---------------------------------------------------------------- zip in / out

              private static Map<String, byte[]> readZip(File file) throws IOException {
                  Map<String, byte[]> map = new LinkedHashMap<>();
                  try (ZipFile zf = new ZipFile(file)) {
                      Enumeration<? extends ZipEntry> en = zf.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          if (e.isDirectory()) continue;
                          try (InputStream in = zf.getInputStream(e)) {
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              byte[] buf = new byte[16384];
                              int r;
                              while ((r = in.read(buf)) > 0) bos.write(buf, 0, r);
                              map.put(e.getName(), bos.toByteArray());
                          }
                      }
                  }
                  return map;
              }

              private static final class Counting extends FilterOutputStream {
                  long count;

                  Counting(OutputStream o) {
                      super(o);
                  }

                  @Override
                  public void write(int b) throws IOException {
                      out.write(b);
                      count++;
                  }

                  @Override
                  public void write(byte[] b, int off, int len) throws IOException {
                      out.write(b, off, len);
                      count += len;
                  }
              }

              /** Writes every entry STORED (uncompressed) with its data starting on a 4-byte boundary. */
              private static void writeAligned(Map<String, byte[]> entries, OutputStream out) throws IOException {
                  Counting counting = new Counting(out);
                  ZipOutputStream zos = new ZipOutputStream(counting);
                  for (Map.Entry<String, byte[]> e : entries.entrySet()) {
                      String name = e.getKey();
                      byte[] data = e.getValue();

                      ZipEntry ze = new ZipEntry(name);
                      ze.setMethod(ZipEntry.STORED);
                      ze.setSize(data.length);
                      ze.setCompressedSize(data.length);
                      CRC32 crc = new CRC32();
                      crc.update(data, 0, data.length);
                      ze.setCrc(crc.getValue());
                      ze.setTime(FIXED_TIME);

                      long dataStart = counting.count + 30 + name.getBytes(StandardCharsets.UTF_8).length;
                      int pad = (int) ((4 - (dataStart % 4)) % 4);
                      if (pad != 0) {
                          int len = pad + 4; // an extra field needs at least 4 bytes (id + size)
                          byte[] extra = new byte[len];
                          extra[0] = 0x35;
                          extra[1] = (byte) 0xD9; // 0xD935: the id zipalign uses for padding
                          extra[2] = (byte) (len - 4);
                          ze.setExtra(extra);
                      }

                      zos.putNextEntry(ze);
                      zos.write(data, 0, data.length);
                      zos.closeEntry();
                  }
                  zos.finish();
                  zos.flush();
              }
          }
          EOF

          cat > $P/builder/src/main/java/com/web2apk/builder/IconMaker.java <<'EOF'
          package com.web2apk.builder;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.util.Locale;

          /** Makes launcher icons: a generated letter icon, or a user image cropped to a square. */
          final class IconMaker {

              /** Final icon size in pixels. */
              static final int SIZE = 256;

              private IconMaker() {
              }

              /** Stable hue seed for the automatic icon color. */
              static int seedFor(String name) {
                  return name == null ? 0 : name.trim().toLowerCase(Locale.ROOT).hashCode();
              }

              /** Draws the generated icon. color == 0 picks a color from the seed. */
              static Bitmap draw(String name, int seed, int color, int size) {
                  Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  float k = size / 192f;

                  int fill = color;
                  if (fill == 0) {
                      float hue = Math.abs(seed % 360);
                      fill = Color.HSVToColor(new float[]{hue, 0.65f, 0.80f});
                  }
                  Paint bg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  bg.setColor(fill);
                  canvas.drawRoundRect(new RectF(0, 0, size, size), 44f * k, 44f * k, bg);

                  String letter = "W";
                  String t = name == null ? "" : name.trim();
                  if (!t.isEmpty()) {
                      int cp = Character.toUpperCase(t.codePointAt(0));
                      letter = new String(Character.toChars(cp));
                  }

                  Paint fg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  fg.setColor(Color.WHITE);
                  fg.setTextAlign(Paint.Align.CENTER);
                  fg.setTextSize(110f * k);
                  fg.setTypeface(Typeface.DEFAULT_BOLD);
                  Paint.FontMetrics fm = fg.getFontMetrics();
                  float y = size / 2f - (fm.ascent + fm.descent) / 2f;
                  canvas.drawText(letter, size / 2f, y, fg);
                  return bmp;
              }

              static byte[] make(String name, int seed, int color) {
                  Bitmap bmp = draw(name, seed, color, SIZE);
                  byte[] png = toPng(bmp);
                  bmp.recycle();
                  return png;
              }

              /** Decodes any PNG/JPG/WebP, center-crops it to a square and scales it to SIZE. */
              static byte[] fromImage(byte[] encoded) throws IOException {
                  BitmapFactory.Options bounds = new BitmapFactory.Options();
                  bounds.inJustDecodeBounds = true;
                  BitmapFactory.decodeByteArray(encoded, 0, encoded.length, bounds);
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                      throw new IOException("That file is not a readable image (use PNG, JPG or WebP)");
                  }

                  int shorter = Math.min(bounds.outWidth, bounds.outHeight);
                  int sample = 1;
                  while (shorter / (sample * 2) >= SIZE * 2) sample *= 2;

                  BitmapFactory.Options opts = new BitmapFactory.Options();
                  opts.inSampleSize = sample;
                  Bitmap src = BitmapFactory.decodeByteArray(encoded, 0, encoded.length, opts);
                  if (src == null) throw new IOException("Could not decode that image");

                  int side = Math.min(src.getWidth(), src.getHeight());
                  int x = (src.getWidth() - side) / 2;
                  int y = (src.getHeight() - side) / 2;
                  Bitmap square = Bitmap.createBitmap(src, x, y, side, side);
                  Bitmap scaled = Bitmap.createScaledBitmap(square, SIZE, SIZE, true);

                  byte[] png = toPng(scaled);
                  if (scaled != square) scaled.recycle();
                  if (square != src) square.recycle();
                  src.recycle();
                  return png;
              }

              private static byte[] toPng(Bitmap bmp) {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  bmp.compress(Bitmap.CompressFormat.PNG, 100, out);
                  return out.toByteArray();
              }
          }
          EOF

          cat > $P/builder/src/main/java/com/web2apk/builder/MainActivity.java <<'EOF'
          package com.web2apk.builder;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import java.io.BufferedOutputStream;
          import java.io.ByteArrayOutputStream;
