              @SuppressWarnings("deprecation")
              private void applySystemBars() {
                  getWindow().setStatusBarColor(theme.bg);
                  getWindow().setNavigationBarColor(theme.bg);
                  int flags = theme.light
                          ? (View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR)
                          : 0;
                  getWindow().getDecorView().setSystemUiVisibility(flags);
              }

              /** Segmented two-option switch. */
              private final class Seg {
                  final LinearLayout view;
                  final TextView a;
                  final TextView b;

                  Seg(String labelA, String labelB, boolean firstSelected) {
                      view = new LinearLayout(MainActivity.this);
                      view.setOrientation(LinearLayout.HORIZONTAL);
                      view.setPadding(dp(4), dp(4), dp(4), dp(4));
                      view.setBackground(rounded(theme.inputBg, 14, theme.stroke, 1));
                      a = segText(labelA);
                      b = segText(labelB);
                      view.addView(a, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                      view.addView(b, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                      select(firstSelected);
                  }

                  void select(boolean first) {
                      style(a, first);
                      style(b, !first);
                  }

                  private void style(TextView t, boolean on) {
                      t.setBackground(on ? rounded(theme.accent, 10) : null);
                      t.setTextColor(on ? theme.onAccent : theme.muted);
                  }
              }

              private void setSourceMode(boolean link) {
                  linkMode = link;
                  sourceSeg.select(link);
                  linkBox.setVisibility(link ? View.VISIBLE : View.GONE);
                  fileBox.setVisibility(link ? View.GONE : View.VISIBLE);
              }

              private void setIconMode(boolean custom) {
                  iconCustom = custom;
                  iconSeg.select(!custom);
                  autoIconBox.setVisibility(custom ? View.GONE : View.VISIBLE);
                  customIconBox.setVisibility(custom ? View.VISIBLE : View.GONE);
                  if (customIconText != null) {
                      customIconText.setText(customIconPng == null ? "PNG, JPG or WebP"
                              : (customIconName == null ? "Image chosen" : customIconName));
                  }
                  updatePreview();
              }

              private void updatePreview() {
                  if (iconPreview == null) return;
                  Bitmap bmp = null;
                  if (iconCustom && customIconPng != null) {
                      bmp = BitmapFactory.decodeByteArray(customIconPng, 0, customIconPng.length);
                  }
                  if (bmp == null) {
                      String n = nameInput != null ? nameInput.getText().toString() : nameVal;
                      bmp = IconMaker.draw(n, IconMaker.seedFor(n), iconColor, 144);
                  }
                  iconPreview.setImageBitmap(bmp);
              }

              private void refreshPickedText() {
                  if (picked.isEmpty()) {
                      pickedText.setTextColor(theme.muted);
                      pickedText.setText("Pick your .html file plus any .css, .js or images it uses.");
                  } else {
                      StringBuilder sb = new StringBuilder();
                      for (Uri u : picked) sb.append(displayName(u)).append('\n');
                      pickedText.setTextColor(theme.text);
                      pickedText.setText(sb.toString().trim());
                  }
              }

              private View themeChip(final int i) {
                  Themes.Theme t = Themes.ALL[i];
                  boolean sel = i == themeIndex;
                  FrameLayout f = new FrameLayout(this);
                  GradientDrawable outer = new GradientDrawable();
                  outer.setShape(GradientDrawable.OVAL);
                  outer.setColor(t.bg);
                  outer.setStroke(dp(sel ? 3 : 1), sel ? theme.accent : theme.stroke);
                  f.setBackground(outer);
                  View dot = new View(this);
                  GradientDrawable d = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{t.accent, t.accent2});
                  d.setShape(GradientDrawable.OVAL);
                  dot.setBackground(d);
                  f.addView(dot, new FrameLayout.LayoutParams(dp(22), dp(22), Gravity.CENTER));
                  f.setContentDescription(t.name + " theme");
                  f.setOnClickListener(v -> setTheme(i));
                  return f;
              }

              private View swatch(final int color) {
                  boolean sel = color == iconColor;
                  FrameLayout f = new FrameLayout(this);
                  GradientDrawable ring = new GradientDrawable();
                  ring.setShape(GradientDrawable.OVAL);
                  ring.setColor(0x00000000);
                  ring.setStroke(dp(sel ? 3 : 1), sel ? theme.text : theme.stroke);
                  f.setBackground(ring);
                  View dot = new View(this);
                  GradientDrawable d;
                  if (color == 0) {
                      d = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                              new int[]{0xFFEF4444, 0xFFEAB308, 0xFF22C55E, 0xFF3B82F6, 0xFF8B5CF6});
                  } else {
                      d = new GradientDrawable();
                      d.setColor(color);
                  }
                  d.setShape(GradientDrawable.OVAL);
                  dot.setBackground(d);
                  f.addView(dot, new FrameLayout.LayoutParams(dp(22), dp(22), Gravity.CENTER));
                  f.setContentDescription(color == 0 ? "Automatic color" : "Icon color");
                  f.setOnClickListener(v -> {
                      iconColor = color;
                      refreshUi();
                  });
                  return f;
              }

              private void setTheme(int i) {
                  if (i == themeIndex) return;
                  themeIndex = i;
                  getSharedPreferences("web2apk", MODE_PRIVATE).edit().putInt("theme", i).apply();
                  refreshUi();
              }

              private void captureInputs() {
                  if (nameInput != null) nameVal = nameInput.getText().toString();
                  if (urlInput != null) urlVal = urlInput.getText().toString();
                  if (pkgInput != null) pkgVal = pkgInput.getText().toString();
              }

              /** Rebuilds the whole screen (new theme, new icon...) and keeps what the user typed. */
              private void refreshUi() {
                  captureInputs();
                  final int y = scroll != null ? scroll.getScrollY() : 0;
                  buildUi();
                  scroll.post(() -> scroll.scrollTo(0, y));
              }

              private void renderState() {
                  buildBtn.setEnabled(!busy);
                  buildBtn.setAlpha(busy ? 0.5f : 1f);
                  statusCard.setVisibility(statusMsg != null ? View.VISIBLE : View.GONE);
                  progress.setVisibility(busy ? View.VISIBLE : View.GONE);
                  statusText.setTextColor(statusErr ? theme.err : theme.text);
                  statusText.setText(statusMsg == null ? "" : statusMsg);
                  boolean showResult = lastApk != null && !busy && statusMsg == null;
                  resultCard.setVisibility(showResult ? View.VISIBLE : View.GONE);
                  resultInfo.setText(resultText);
              }

              // ------------------------------------------------------------------ styling helpers

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(int color, int radiusDp, int strokeColor, int strokeDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radiusDp));
                  if (strokeDp > 0) d.setStroke(dp(strokeDp), strokeColor);
                  return d;
              }

              private GradientDrawable rounded(int color, int radiusDp) {
                  return rounded(color, radiusDp, 0, 0);
              }

              private Drawable rippled(Drawable content, int radiusDp, int rippleColor) {
                  return new RippleDrawable(ColorStateList.valueOf(rippleColor), content, rounded(Color.WHITE, radiusDp));
              }

              private void roundClip(View v, final int radiusPx) {
                  v.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View view, Outline outline) {
                          outline.setRoundRect(0, 0, view.getWidth(), view.getHeight(), radiusPx);
                      }
                  });
                  v.setClipToOutline(true);
              }

              private LinearLayout.LayoutParams matchWrap(int topMarginDp) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(topMarginDp);
                  return lp;
              }

