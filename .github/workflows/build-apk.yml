              /** Dashed tap target: child 0 is the title, child 1 the subtitle. */
              private LinearLayout dashedPicker(String title, String subtitle) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setGravity(Gravity.CENTER_HORIZONTAL);
                  c.setPadding(dp(16), dp(20), dp(16), dp(20));
                  GradientDrawable dashed = rounded(theme.inputBg, 14, theme.accent, 1);
                  dashed.setStroke(dp(1), theme.accent, dp(6), dp(4));
                  c.setBackground(rippled(dashed, 14, theme.light ? 0x22000000 : 0x33FFFFFF));
                  c.setClickable(true);
                  TextView t = text(title, 16f, theme.accent, true);
                  t.setGravity(Gravity.CENTER);
                  TextView s = text(subtitle, 13f, theme.muted, false);
                  s.setGravity(Gravity.CENTER);
                  s.setPadding(0, dp(6), 0, 0);
                  c.addView(t);
                  c.addView(s);
                  return c;
              }

              private Button button(String s, boolean primary) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(primary ? theme.onAccent : theme.text);
                  b.setTextSize(16f);
                  b.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  b.setStateListAnimator(null);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  b.setPadding(dp(16), dp(15), dp(16), dp(15));
                  Drawable bg;
                  int ripple;
                  if (primary) {
                      GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                              new int[]{theme.accent, theme.accent2});
                      g.setCornerRadius(dp(16));
                      bg = g;
                      ripple = Color.luminance(theme.onAccent) > 0.5f ? 0x33FFFFFF : 0x22000000;
                  } else {
                      bg = rounded(0x00000000, 16, theme.stroke, 1);
                      ripple = theme.light ? 0x22000000 : 0x33FFFFFF;
                  }
                  b.setBackground(rippled(bg, 16, ripple));
                  return b;
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }

              // ------------------------------------------------------------------ picking files

              private void pickFiles() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, REQ_PICK);
              }

              private void pickIcon() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("image/*");
                  startActivityForResult(i, REQ_ICON);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != RESULT_OK || data == null) return;

                  if (requestCode == REQ_ICON) {
                      final Uri u = data.getData();
                      if (u == null) return;
                      final String chosenName = displayName(u);
                      new Thread(() -> {
                          try {
                              byte[] png = IconMaker.fromImage(readAll(u, MAX_ICON_BYTES));
                              runOnUiThread(() -> {
                                  customIconPng = png;
                                  customIconName = chosenName;
                                  iconCustom = true;
                                  refreshUi();
                              });
                          } catch (Throwable t) {
                              final String m = t.getMessage() != null ? t.getMessage() : t.toString();
                              runOnUiThread(() -> toast("Icon: " + m));
                          }
                      }).start();
                      return;
                  }

                  if (requestCode != REQ_PICK) return;

                  picked.clear();
                  ClipData clip = data.getClipData();
                  if (clip != null) {
                      for (int n = 0; n < clip.getItemCount(); n++) picked.add(clip.getItemAt(n).getUri());
                  } else if (data.getData() != null) {
                      picked.add(data.getData());
                  }
                  for (Uri u : picked) {
                      try {
                          getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception ignored) {
                      }
                  }
                  refreshPickedText();
              }

              private String displayName(Uri uri) {
                  String name = null;
                  try (Cursor c = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null)) {
                      if (c != null && c.moveToFirst()) name = c.getString(0);
                  } catch (Exception ignored) {
                  }
                  if (name == null || name.isEmpty()) {
                      name = uri.getLastPathSegment();
                      if (name == null || name.isEmpty()) name = "file";
                  }
                  return name.replace('/', '_').replace('\\', '_');
              }

              private byte[] readAll(Uri uri, long limit) throws IOException {
                  try (InputStream in = getContentResolver().openInputStream(uri)) {
                      if (in == null) throw new IOException("Cannot open " + uri);
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int r;
                      while ((r = in.read(buf)) > 0) {
                          bos.write(buf, 0, r);
                          if (bos.size() > limit) throw new IOException("File is too large");
                      }
                      return bos.toByteArray();
                  }
              }

              // ------------------------------------------------------------------ building

              private void startBuild() {
                  captureInputs();
                  final String name = nameVal.trim();
                  if (name.isEmpty()) {
                      toast("Enter an app name");
                      return;
                  }
                  final boolean link = linkMode;
                  final String url = urlVal.trim();
                  if (link && url.isEmpty()) {
                      toast("Enter a website link");
                      return;
                  }
                  if (!link && picked.isEmpty()) {
                      toast("Choose an HTML file first");
                      return;
                  }
                  final String customPkg = pkgVal.trim();
                  if (!customPkg.isEmpty()) {
                      if (!ApkPatcher.isValidPackage(customPkg)) {
                          toast("Package ID must look like com.yourname.myapp: letters, digits and _, "
                                  + "each part starting with a letter, at least one dot");
                          return;
                      }
                      if (customPkg.equals(ApkPatcher.BUILDER_PACKAGE)) {
                          toast("That ID belongs to Web2APK itself. Pick another one.");
                          return;
                      }
                  }
                  if (iconCustom && customIconPng == null) {
                      toast("Choose an icon image, or switch the icon to Auto letter");
                      return;
                  }
                  final byte[] iconPng = iconCustom ? customIconPng : null;
                  final int colorSnapshot = iconColor;
                  final List<Uri> uris = new ArrayList<>(picked);

                  busy = true;
                  lastApk = null;
                  statusMsg = "Building your app…";
                  statusErr = false;
                  renderState();

                  new Thread(() -> {
                      try {
                          Result r = doBuild(name, link, url, uris, customPkg, iconPng, colorSnapshot);
                          runOnUiThread(() -> onBuilt(r));
                      } catch (Throwable t) {
                          runOnUiThread(() -> onFailed(t));
                      }
                  }).start();
              }

              private Result doBuild(String name, boolean link, String url, List<Uri> uris,
                                     String customPkg, byte[] customIcon, int color) throws Exception {
                  String config;
                  Map<String, byte[]> www = new LinkedHashMap<>();

                  if (link) {
                      String u = url;
                      if (!u.startsWith("http://") && !u.startsWith("https://")) u = "https://" + u;
                      config = "URL=" + u;
                  } else {
                      String entry = null;
                      long total = 0;
                      for (Uri uri : uris) {
                          String fname = displayName(uri);
                          byte[] data = readAll(uri, MAX_BYTES);
                          total += data.length;
                          if (total > MAX_BYTES) throw new IOException("Files are too large (limit 64 MB)");
                          www.put(fname, data);
                          String low = fname.toLowerCase(Locale.ROOT);
                          if (low.endsWith(".html") || low.endsWith(".htm")) {
                              if (entry == null || low.startsWith("index.")) entry = fname;
                          }
                      }
                      if (entry == null) throw new IOException("Please choose at least one .html file");
                      config = "FILE=" + entry;
                  }

                  // Same name + same source => same package name, so rebuilding updates the installed app
                  String pkg = customPkg.isEmpty() ? "com.w2a.x" + hash16(name + "|" + config) : customPkg;

                  File dir = new File(getCacheDir(), "apks");
                  if (!dir.exists()) dir.mkdirs();
                  File[] old = dir.listFiles();
                  if (old != null) for (File f : old) f.delete();

                  File template = new File(dir, "template.tmp");
                  try (InputStream in = getAssets().open("template.apk");
                       OutputStream out = new FileOutputStream(template)) {
                      byte[] buf = new byte[16384];
                      int r;
                      while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                  }

                  byte[] icon = customIcon != null ? customIcon : IconMaker.make(name, IconMaker.seedFor(name), color);

                  File unsigned = new File(dir, "unsigned.tmp");
                  try (OutputStream out = new BufferedOutputStream(new FileOutputStream(unsigned))) {
                      ApkPatcher.build(template, out, pkg, name, icon, config, www);
                  }

                  File signed = new File(dir, safeFileName(name) + ".apk");
                  Signer.sign(unsigned, signed);
                  template.delete();
                  unsigned.delete();

                  Result res = new Result();
                  res.apk = signed;
                  res.pkg = pkg;
                  return res;
              }

              private static String hash16(String s) throws Exception {
                  byte[] d = MessageDigest.getInstance("SHA-256").digest(s.getBytes("UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 8; i++) sb.append(String.format("%02x", d[i]));
                  return sb.toString();
              }

              private static String safeFileName(String name) {
                  String s = name.replaceAll("[^A-Za-z0-9._-]", "_");
                  return s.replace("_", "").isEmpty() ? "app" : s;
              }

              private void onBuilt(Result r) {
                  busy = false;
                  statusMsg = null;
                  statusErr = false;
                  lastApk = r.apk;
                  resultText = r.apk.getName() + "  ·  " + (r.apk.length() / 1024) + " KB\n" + r.pkg;
                  renderState();
              }

              private void onFailed(Throwable t) {
                  busy = false;
                  String msg = String.valueOf(t);
                  if (t.getCause() != null) msg += "\n" + t.getCause();
                  statusMsg = "Build failed:\n" + msg;
                  statusErr = true;
                  renderState();
              }

              // ------------------------------------------------------------------ install / share

              private Uri apkUri() {
                  return FileProvider.getUriForFile(this, "com.web2apk.builder.files", lastApk);
              }

              private void installApk() {
                  if (lastApk == null) return;
                  if (!getPackageManager().canRequestPackageInstalls()) {
                      toast("Allow installs from Web2APK, then come back and tap Install again");
                      startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(apkUri(), "application/vnd.android.package-archive");
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(i);
              }

              private void shareApk() {
                  if (lastApk == null) return;
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("application/vnd.android.package-archive");
                  i.putExtra(Intent.EXTRA_STREAM, apkUri());
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(Intent.createChooser(i, "Share APK"));
              }
          }
          EOF

          cat > $P/builder/src/main/java/com/web2apk/builder/Signer.java <<'EOF'
          package com.web2apk.builder;

          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;

          import com.android.apksig.ApkSigner;

          import java.io.File;
          import java.math.BigInteger;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.security.cert.X509Certificate;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;

          import javax.security.auth.x500.X500Principal;

          /**
           * Signs APKs with a key that lives in the Android Keystore of this phone.
           * The same key is reused for every app, so rebuilding an app updates the installed one.
           */
          final class Signer {

              private static final String ALIAS = "web2apk_signing_key";

              private Signer() {
              }

              static void sign(File unsignedApk, File signedApk) throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);

                  if (!ks.containsAlias(ALIAS)) {
                      KeyPairGenerator kpg = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_RSA, "AndroidKeyStore");
                      kpg.initialize(new KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_SIGN)
                              .setKeySize(2048)
                              .setDigests(KeyProperties.DIGEST_SHA256)
                              .setSignaturePaddings(KeyProperties.SIGNATURE_PADDING_RSA_PKCS1)
                              .setCertificateSubject(new X500Principal("CN=Web2APK"))
                              .setCertificateSerialNumber(BigInteger.ONE)
                              .setCertificateNotBefore(new Date(System.currentTimeMillis() - 86400000L))
                              .setCertificateNotAfter(new Date(2208988800000L)) // 2040-01-01
                              .build());
                      kpg.generateKeyPair();
                  }

                  PrivateKey key = (PrivateKey) ks.getKey(ALIAS, null);
                  Certificate[] chain = ks.getCertificateChain(ALIAS);
                  List<X509Certificate> certs = new ArrayList<>();
                  for (Certificate c : chain) certs.add((X509Certificate) c);

                  ApkSigner.SignerConfig cfg = new ApkSigner.SignerConfig.Builder("web2apk", key, certs).build();
                  ApkSigner signer = new ApkSigner.Builder(Collections.singletonList(cfg))
                          .setInputApk(unsignedApk)
                          .setOutputApk(signedApk)
                          .setMinSdkVersion(24)
                          .setV1SigningEnabled(false)
                          .setV2SigningEnabled(true)
                          .setV3SigningEnabled(false)
                          .build();
                  signer.sign();
              }
          }
